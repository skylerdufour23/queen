<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS 2.0 IPA Legacy Converter</title>
    <link rel="stylesheet" href="css/style-1.css">
    <script src="js/main-1.js" defer></script>
</head>
<body>
    <div id="app">
        <h1>iOS 2.0 IPA Legacy Converter</h1>
        <p>Convert modern app bundles or assets to legacy iPhoneOS 2.0 compatible IPA formats.</p>
        <div class="converter-box">
            <input type="file" id="ipa-upload" accept=".zip,.ipa">
            <button id="convert-btn">Convert Payload</button>
        </div>
        <div id="status-log"></div>
    </div>
</body>
</html>
